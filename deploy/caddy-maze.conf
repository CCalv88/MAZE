	# MAZE (Node app on 3700, see /opt/maze). External scripts only, so the CSP allows no
	# inline script; the game opens a same-origin WebSocket at /maze/ws.
	handle /maze {
		redir * /maze/ permanent
	}

	handle /maze/* {
		header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://stegopets.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
		uri strip_prefix /maze
		reverse_proxy 127.0.0.1:3700
	}

